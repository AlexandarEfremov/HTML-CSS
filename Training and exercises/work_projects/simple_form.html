<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Your Course Landing Page</h1>
    <form action="">
        <div>
            <label for="course_title">Course Title</label>
            <input type="text" id="course_title" required name="title">
        </div>
        <div>
            <label for="course_description">Course Description</label>
        </div>
        <div>
            <textarea name="description" id="course_description" rows="10" cols="30" name="desc"></textarea>
        </div>

        <div>
            <label for="skill_level">Skill Level</label>
            <select name="level" id="skill_level">
                <option value="beginner">Beginner Level</option>
                <option value="medium">Medium Level</option>
                <option value="advanced">Advanced Level</option>
            </select>
        </div>
        
        <div>
            <label for="ready_to_publish">Ready to publish course?</label>
            <input type="checkbox" id="ready_to_publish" name="publish">
        </div>
        <button>Submit</button>
    </form>
</body>
</html>
