<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Card</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
  <div class="card-container">
    <nav class="navigation">
      <span>Home</span>
      <span>Case Studies</span>
      <span>Testimonials</span>
      <span>Recent Work</span>
      <span>Get In Touch</span>
      <div class="nav-icons">
        <span><i class="fa-brands fa-linkedin-in"></i></span>
        <span><i class="fa-brands fa-behance"></i></span>
        <span><i class="fa-brands fa-twitter"></i></span>
      </div>
    </nav>

    <main class="main-flex">
      <div class="inner-main">
        <div class="main-left">
          <h1>Your Name Here</h1>
          <p>
            Intro text: Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut
            labore et
            dolore magna aliqua.
          </p>
          <a href="#" class="get-started">
            Let’s get started >
          </a>
        </div>
        <div class="main-right">
          <img src="images/profile_350x350.png" alt="">
        </div>
      </div>
    </main>

    <footer class="footer-sponsors">
      <span class="worked-with">Worked with:</span>

      <div class="sponsor-cards">
        <span>
          <img src="images/clickup logo.png" alt="clickup">
        </span>
        <span>
          <img src="images/dropbox_blue logo.png" alt="drop">
        </span>
        <span>
          <img src="images/Paychex logo.png" alt="paycheck">
        </span>
        <span>
          <img src="images/Elastic logo.png" alt="elastic">
        </span>
        <span>
          <img src="images/stripe logo.png" alt="stripe">
        </span>
      </div>
    </footer>
  </div>
</body>

</html>
