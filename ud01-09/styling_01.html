<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="styling_01.css">
      <style>
            h2 {
                  color: green;
            }
      </style>
      <title>Document</title>
</head>
<body>
      <h1 style="color: purple;">Make me purple (inline style)</h1>
      <h2>Make me green (internal style)</h2>
      <h3>Make me orange (external style)</h3>
</body>
</html>
