<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="index.css">
      <title>Document</title>
</head>

<body>
      <div class="card">
            <h1>Registration</h1>
            <form action="#" method="post">
                  <fieldset class="form-group">
                        <legend>Login Information</legend>

                        <p class="form-class">
                              <input type="email" name="email" id="email" placeholder="Email">
                              <label for="email">Email</label>
                              <span>example: john.doe@gmail.com</span>
                        </p>
                        <p class="form-class">
                              <input type="password" name="password" id="password" placeholder="Password">
                              <label for="password">Password</label>
                              <span>minimum 6 characters, letters and numbers, as least 1 special character</span>
                        </p>
                  </fieldset>

                  <fieldset class="form-group">
                        <legend>Additional Information</legend>

                        <p class="form-class">
                              <input type="date" name="date" id="date" placeholder="Password">
                              <label class="date-label" for="date">Date of Birth</label>
                              <span>example: 01/01/1990</span>
                        </p>
                  </fieldset>
                  <button>Login</button>
            </form>
      </div>
</body>

</html>
