<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="index.css">
      <title>Single Blog Post</title>
</head>

<body>
      <header>
            <h1>Blog Post Title</h1>
      </header>
      <main>
            <section class="posts">
                  <article>
                        <p>
                              Posted by <strong>Author Name</strong> on <time datetime="2024-01-24">January 24,
                                    2024</time>
                        </p>
                        <p>
                              This is the introduction of your blog post...
                        </p>
                  </article>
            </section>

            <section class="comments">
                  <article>
                        <h2>Comments</h2>
                        <p>
                              John Doe - <time datetime="2024-01-25">January 25, 2024</time>
                        </p>
                        <p>
                              This is a comment on the blog post.
                        </p>
                  </article>
            </section>
      </main>
</body>

</html>
