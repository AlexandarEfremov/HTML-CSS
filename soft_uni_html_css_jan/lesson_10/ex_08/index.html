<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="index.css">
      <title>Document</title>
</head>

<body>
      <div class="card">
            <h2>Contact</h2>
            <form action="#" method="post">
                  <label class="first-label" for="username">Your Name</label>
                  <input type="text" name="username" id="username">
                  <span>First and Last name is enough</span>

                  <label class="second-label" for="email">Email</label>
                  <input type="email" name="email" id="email">
                  <span>example: john.doe@gmail.com</span>

                  <label class="third-label" for="subject">Subject</label>
                  <input type="text" name="subject" id="subject">
                  <span>What is this about?</span>

                  <label class="fourth-label" for="textarea">Message</label>
                  <textarea name="textarea" id="textarea"></textarea>
                  <span>Let us know what you need</span>

                  <button class="send-button">Send</button>
            </form>
      </div>
</body>

</html>
