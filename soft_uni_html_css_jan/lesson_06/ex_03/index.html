<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <div class="calendar">
            <div class="item-1">

                <div class="thursday">4 Thursday</div>

            </div>
            <div class="item-2">
                <p>Reminders</p>
            </div>

                <div class="weekend">Weekend</div>
                <div class="saturday">6 Saturday</div>

                <p>Special Dates</p>
            </div>
        </div>
