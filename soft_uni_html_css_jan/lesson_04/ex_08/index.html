<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="index.css">
      <title>ex_08</title>
</head>

<body>
      <div class="link-buttons">
            <h1>Link as a button</h1>
            <div class="links">
                  <a href="#" class="lightgray">Click Me!</a>
                  <a href="#" class="orange">Click Me!</a>
                  <a href="#" class="lightyellow">Click Me!</a>
                  <a href="#" class="white">Click Me!</a>
                  <a href="#" class="gray">Edit</a>
            </div>
      </div>
      <div class="buttons">
            <h2>Button element with class button</h2>
            <button type="submit" class="lightgray">
                  Click Me!
            </button>
            <button type="submit" class="orange">
                  Click Me!
            </button>
            <button type="submit" class="lightyellow">
                  Click Me!
            </button>
            <button>
                  Click Me!
            </button>
            <button type="submit" class="gray">
                  Edit
            </button>
      </div>
</body>

</html>
