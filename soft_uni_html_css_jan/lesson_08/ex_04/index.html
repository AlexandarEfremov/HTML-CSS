<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="index.css">
      <title>Document</title>
</head>

<body>
      <div class="card-one">
            <h1>Table Title</h1>
            <table class="table-one">
                  <tr>
                        <th>Title 1</th>
                        <th>Title 2 is fairly very long</th>
                        <th>Title 3</th>
                  </tr>
                  <tr>
                        <td class="title-one">Value 1</td>
                        <td class="title-long">Value 2</td>
                        <td class="title-three">Value 3</td>
                  </tr>
                  <tr>
                        <td class="title-one">Value 1</td>
                        <td class="title-long">Value 2</td>
                        <td class="title-three">Value 3</td>
                  </tr>
                  <tr class="last">
                        <td class="title-one">Value 1</td>
                        <td class="title-long">Value 2</td>
                        <td class="title-three">Value 3</td>
                  </tr>
            </table>
      </div>
      <div class="card-two">
            <table class="table-two">
                  <tr>
                        <th>Header 1</th>
                        <th>Header 22</th>
                        <th>Header 333</th>
                  </tr>
                  <tr>
                        <td class="header-one">Row 1, Col 1</td>
                        <td class="header-two">Row 1, Col 2</td>
                        <td class="header-three">Row 1, Col 3</td>
                  </tr>
                  <tr>
                        <td class="header-one">Row 2, Col 1</td>
                        <td class="header-two">Row 2, Col 2</td>
                        <td class="header-three">Row 2, Col 3</td>
                  </tr>
                  <tr class="last">
                        <td class="header-one">Row 1, Col 1</td>
                        <td class="header-two">Row 2, Col 2</td>
                        <td class="header-three">Row 3, Col 3</td>
                  </tr>
            </table>
      </div>
</body>

</html>
